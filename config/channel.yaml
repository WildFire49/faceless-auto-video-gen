# Channel identity and creative defaults (SPEC.md 4.1).
#
# Everything a human might want to tune lives here rather than in code. The
# entries marked "decide" are still open in SPEC.md 12.

channel_name: "Rewind" # decide: final name
beat_seconds: 5.0
target_beats: [9, 12] # 45-60s videos
aspect: "9:16"
resolution: [1080, 1920]

voice:
  engine: chatterbox # swap: kokoro | piper -- see SPEC.md 14.2
  reference: assets/voice/reference.wav
  exaggeration: { setup: 0.45, punch: 0.8, fact: 0.5 }
  cfg_weight: 0.4
  punch_pause_ms: 250

art_style: >
  painterly historical documentary illustration, warm candlelight palette,
  subtle film grain, cinematic composition, vertical frame

music:
  target_bpm: 96 # one bar = 2.5s, two bars = one 5s beat
  duck_db: -14

limits:
  max_modern_refs_per_video: 3
  max_sfx_per_beat: 1
  max_words_per_beat: 14

llm:
  provider: ollama # swap: openai_compat
  # qwen3:8b rather than qwen2.5:14b. Fact extraction is pure structured
  # output, and Qwen3 is the most reliable sub-8B model at schema-following;
  # ~5 GB at Q4 also leaves headroom on an 8 GB card for FLUX from M6.
  model: "qwen3:8b"
  # Low temperature: we want the model to copy evidence sentences verbatim,
  # not to write nicely. Creativity here shows up as hallucinated dates.
  temperature: 0.1
  # Ollama waits this long for a response before giving up.
  request_timeout_seconds: 120
  # The model gets one chunk at a time; larger chunks lose facts in the middle.
  max_chunk_chars: 6000

research:
  # v1 sources (SPEC.md 5.2). Order matters: earlier sources win on conflict.
  sources: [wikipedia, user_url]
  # Gate A will not open with fewer than this many verified facts.
  min_facts: 8
  # How many distinct eras the facts must span.
  min_eras: 4
  # An extracted evidence sentence must match the source text at least this
  # closely to survive. Below 1.0 to tolerate whitespace and unicode
  # normalisation, but high enough that a reworded "quote" is rejected.
  evidence_match_threshold: 0.90
  # Cap on Wikipedia articles followed per topic.
  max_articles: 3

visuals:
  backend: flux_diffusers # swap: comfyui_api | sdxl

captions:
  engine: faster_whisper # swap: whisperx

render:
  backend: moviepy # swap: ffmpeg_direct
