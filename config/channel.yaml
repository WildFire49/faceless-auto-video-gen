# Channel identity and creative defaults (SPEC.md 4.1).
#
# Everything a human might want to tune lives here rather than in code. The
# entries marked "decide" are still open in SPEC.md 12.

channel_name: "Rewind" # decide: final name
beat_seconds: 5.0
aspect: "9:16"
resolution: [1080, 1920]

voice:
  engine: chatterbox # swap: kokoro | piper -- see SPEC.md 14.2
  reference: assets/voice/reference.wav
  exaggeration: { setup: 0.45, punch: 0.8, fact: 0.5 }
  cfg_weight: 0.4
  punch_pause_ms: 250

art_style: >
  painterly historical documentary illustration, warm candlelight palette,
  subtle film grain, cinematic composition, vertical frame

music:
  target_bpm: 96 # one bar = 2.5s, two bars = one 5s beat
  duck_db: -14

relevance:
  # Live trend sources, in order. A source that is down is skipped, never
  # fatal: the evergreen bank alone is enough to make an episode.
  # Shipped: google_trends, wiki_pageviews.
  # YouTube's mostPopular needs an API key and Reddit needs ToS care -- both
  # are one file each in ai/rewind_ai/relevance/sources/ when you want them.
  sources: [google_trends, wiki_pageviews]
  geo: US
  # THE HARD CEILING (SPEC.md 5.3). Three is the point at which a history
  # video stops being history and starts being an advert. Enforced in Go, so
  # the CLI and the dashboard cannot disagree.
  max_selectable: 3
  # How many to generate for you to choose from.
  max_proposals: 8

limits:
  max_sfx_per_beat: 1
  max_words_per_beat: 14

script:
  # 45 seconds at 5s per beat. Fixed by decision at M4 kickoff (SPEC.md 12).
  beats: 9
  # Generate -> validate -> regenerate with the broken rules fed back. After
  # this many, the best attempt goes to Gate C with its violations shown, so
  # you can fix it by hand; Gate C cannot be approved until none remain.
  max_attempts: 3
  # Within each attempt, how many times to rewrite ONLY the beats that break
  # a rule, every other beat locked. Cheap (seconds, not a minute) and far
  # more reliable than a full rewrite for a line that is 2 words too long.
  max_repairs: 3
  # Warmer than fact extraction (llm.temperature): this is writing. The
  # validator, not a cold model, is what keeps every number true.
  temperature: 0.7
  # Repairs rewrite a broken beat to an instruction ("at most 9 words, keep
  # this date"). That is editing, not writing, so it runs cold.
  repair_temperature: 0.2
  # The last beat must share this many content words with the first, so the
  # video loops (SPEC.md 5.4).
  loop_min_shared_words: 2
  title_options: 3
  # Each beat is written as a fact line and a punch. Models cannot count to
  # limits.max_words_per_beat, but can write two short parts; the fact line
  # gets whatever the punch leaves.
  punch_words: 5

llm:
  provider: ollama # swap: openai_compat
  # qwen3:8b rather than qwen2.5:14b. Fact extraction is pure structured
  # output, and Qwen3 is the most reliable sub-8B model at schema-following;
  # ~5 GB at Q4 also leaves headroom on an 8 GB card for FLUX from M6.
  model: "qwen3:8b"
  # Low temperature: we want the model to copy evidence sentences verbatim,
  # not to write nicely. Creativity here shows up as hallucinated dates.
  temperature: 0.1
  # Ollama waits this long for a response before giving up.
  request_timeout_seconds: 120
  # The model gets one chunk at a time; larger chunks lose facts in the middle.
  max_chunk_chars: 6000

# WHAT KIND OF VIDEO THIS CHANNEL MAKES.
#
# One line. The format owns what an item is, the prompts that extract it, which
# values are implausible, how items are grouped for variety, and the review
# thresholds at its gate. Everything else in the pipeline -- fetching, the
# evidence verifier, the gates, the dashboard -- is unchanged by this choice.
#
# Shipped: history_timeline, myth_vs_fact
# Adding one is a single file in ai/rewind_ai/formats/providers/ (SPEC.md 14.2).
content:
  format: history_timeline

research:
  # v1 sources (SPEC.md 5.2). Order matters: earlier sources win on conflict.
  sources: [wikipedia, user_url]
  # Item counts and grouping are NOT here -- they belong to the content format,
  # because they differ by kind of video. See content.format above.
  #
  # Ceiling on what reaches a human. A real run produced 141 facts, which
  # passes every threshold and is a miserable thing to review; the
  # best-verified survive.
  max_items: 40
  # An extracted evidence sentence must match the source text at least this
  # closely to survive. Below 1.0 to tolerate whitespace and unicode
  # normalisation, but high enough that a reworded "quote" is rejected.
  evidence_match_threshold: 0.90
  # Cap on Wikipedia articles followed per topic.
  max_articles: 3

visuals:
  backend: flux_diffusers # swap: comfyui_api | sdxl

captions:
  engine: faster_whisper # swap: whisperx

render:
  backend: moviepy # swap: ffmpeg_direct
