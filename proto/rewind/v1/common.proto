syntax = "proto3";

// Package rewind.v1 is the contract between the Go API (api/) and the Python
// AI worker (ai/). It is also generated for TypeScript so the Next.js
// dashboard (web/) never hand-writes an API type.
//
// Rules (SPEC.md 2.5):
//   - Messages carry PATHS, not bytes. Media never travels over gRPC.
//   - Every long-running RPC is server-streaming and emits Progress events.
//   - Field numbers are the wire format: never reuse or renumber a shipped field.
package rewind.v1;

// Progress is emitted repeatedly while a long job runs, so the dashboard can
// show a real progress bar instead of an indefinite spinner.
message Progress {
  // Human-readable stage, shown verbatim in the UI. e.g. "fetching wikipedia".
  string stage = 1;
  // 0.0 to 1.0. Best effort; the UI falls back to indeterminate when unset.
  double percent = 2;
  // Optional sub-step counters, e.g. beat 7 of 12.
  int32 current = 3;
  int32 total = 4;
}

// Failure is the terminal event when a job cannot complete.
//
// Python reports WHAT went wrong. Go decides what that MEANS for the video's
// status -- the AI worker never sets a status itself.
message Failure {
  // Stable machine-readable code, e.g. "SOURCE_UNREACHABLE", "MODEL_MISSING".
  string code = 1;
  // Operator-facing detail, safe to show in the dashboard.
  string message = 2;
  // Whether Go should retry with backoff. Transient infrastructure problems
  // set this true; deterministic problems (validation) set it false.
  bool retryable = 3;
}

// VideoRef identifies the project folder a job reads from and writes to.
// The id is validated against ^[a-z0-9-]{1,64}$ at the Go boundary before it
// is ever used to build a path (SPEC.md 13.5).
message VideoRef {
  string video_id = 1;
}
