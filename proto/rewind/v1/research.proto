syntax = "proto3";

package rewind.v1;

import "rewind/v1/common.proto";

// ResearchService builds a timeline of true, sourced facts (SPEC.md 5.2).
//
// The rule this service exists to enforce: THE LLM IS NEVER THE SOURCE OF A
// FACT. It only extracts from text that was fetched, and every extraction must
// carry the exact sentence it came from. A verifier then checks that sentence
// really appears in the fetched source, and drops anything that does not.
// That is what makes hallucinated dates impossible rather than unlikely.
service ResearchService {
  // BuildFactSheet researches a topic.
  //
  // Server-streaming: research takes minutes, so progress events flow while it
  // works and one terminal message ends it (SPEC.md 2.5).
  rpc BuildFactSheet(BuildFactSheetRequest) returns (stream BuildFactSheetResponse);
}

message BuildFactSheetRequest {
  // Go's id. The worker uses it only to choose the output folder.
  string video_id = 1;
  string topic = 2;
  // Extra URLs supplied by the human, fetched alongside Wikipedia.
  repeated string extra_urls = 3;
  // Below this many verified facts the worker reports failure rather than
  // handing over a fact sheet too thin to review.
  int32 min_facts = 4;
}

// One streamed event: repeated progress, then exactly one terminal
// result or failure.
message BuildFactSheetResponse {
  oneof event {
    Progress progress = 1;
    FactSheet result = 2;
    Failure failure = 3;
  }
}

// Fact is one timeline entry (SPEC.md 5.2).
message Fact {
  string id = 1; // "f1", "f2", ...

  // How the year is spoken, e.g. "~9,000 years ago" or "1882".
  string year_label = 2;
  // Sortable year; negative for BC. -7000 means 7000 BC.
  int32 sort_year = 3;

  string place = 4;
  // The claim, in the narrator's words.
  string claim = 5;

  // The EXACT sentence from the source that supports the claim. The verifier
  // checks this appears in the fetched text; a fact whose evidence cannot be
  // found is dropped before a human ever sees it.
  string evidence = 6;
  string source_url = 7;
  // Title of the source, for display next to the link.
  string source_title = 8;

  // "high" | "medium" | "low", from how directly the evidence supports it.
  string confidence = 9;
  // True when sources disagree about this fact.
  bool conflict = 10;
  // Set by the human at Gate A; the worker always leaves it unset.
  bool approved = 11;

  // How closely the evidence matched the source, 0..1. Surfaced at Gate A so
  // a borderline match can be eyeballed.
  double match_score = 12;
}

message SourceDocument {
  string url = 1;
  string title = 2;
  // Which fetcher produced it: "wikipedia", "user_url", ...
  string fetcher = 3;
  int32 char_count = 4;
}

message FactSheet {
  string topic = 1;
  repeated Fact facts = 2;
  repeated SourceDocument sources = 3;

  // Where the worker wrote facts.json. Paths, not bytes (SPEC.md 2.5).
  string facts_json_path = 4;

  // How many candidates the LLM proposed and how many survived verification.
  // Shown at Gate A: a large gap is a signal the model is drifting, and worth
  // knowing before you trust what is left.
  int32 candidates_extracted = 5;
  int32 candidates_rejected = 6;
}
